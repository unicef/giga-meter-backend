services:
  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    container_name: giga-meter-pgbouncer
    restart: unless-stopped
    environment:
      # PostgreSQL is an existing service on the host, exposed on port 7432.
      DB_HOST: host.docker.internal
      DB_PORT: ${POSTGRES_PORT:-7432}
      DB_USER: ${POSTGRES_USER:-test}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-test}
      DB_NAME: ${POSTGRES_DB:-pcdc}
      AUTH_TYPE: ${PGBOUNCER_AUTH_TYPE:-scram-sha-256}
      POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-500}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
      RESERVE_POOL_TIMEOUT: ${PGBOUNCER_RESERVE_POOL_TIMEOUT:-3}
      SERVER_RESET_QUERY: DISCARD ALL
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
    ports:
      # edoburu/pgbouncer listens on 5432 inside the container.
      - "${PGBOUNCER_PORT:-6432}:5432"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-test} -d ${POSTGRES_DB:-pcdc}"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: giga-meter-api
    restart: unless-stopped
    depends_on:
      pgbouncer:
        condition: service_healthy
    environment:
      # Runtime Prisma traffic goes through PgBouncer.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-test}:${POSTGRES_PASSWORD:-test}@pgbouncer:5432/${POSTGRES_DB:-pcdc}?schema=public&pgbouncer=true&connection_limit=${PRISMA_CONNECTION_LIMIT:-10}&pool_timeout=${PRISMA_POOL_TIMEOUT:-20}"
      # Prisma Migrate bypasses PgBouncer and connects directly to PostgreSQL.
      DIRECT_DATABASE_URL: "postgresql://${POSTGRES_USER:-test}:${POSTGRES_PASSWORD:-test}@host.docker.internal:${POSTGRES_PORT:-7432}/${POSTGRES_DB:-pcdc}?schema=public"
      # Redis is an existing service on the host.
      REDIS_URL: "redis://host.docker.internal:${REDIS_PORT:-6379}"
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      USE_AUTH: ${USE_AUTH:-false}
      GIGA_METER_APP_KEY: ${GIGA_METER_APP_KEY:-12345}
      DAILY_CHECK_APP_API_CODE: ${DAILY_CHECK_APP_API_CODE:-DAILY_CHECK_APP}
      PROJECT_CONNECT_SERVICE_URL: ${PROJECT_CONNECT_SERVICE_URL:-}
      PCDC_APP_DOWNLOAD_URL: ${PCDC_APP_DOWNLOAD_URL:-}
      NO_CACHE: ${NO_CACHE:-FALSE}
      CACHE_EXPIRE: ${CACHE_EXPIRE:-1800}
      SENTRY_DSN: ${SENTRY_DSN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PORT:-3000}:3000"
    command: ["npm", "run", "start:prod"]
